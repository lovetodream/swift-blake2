name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linux-all:
    strategy:
      fail-fast: false
      matrix:
        swift-image:
          - swift:6.2-noble
          - swift:6.3-noble
          - swiftlang/swift:nightly-main-noble
        include:
          - swift-image: swiftlang/swift:nightly-main-noble
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    container: ${{ matrix.swift-image }}
    runs-on: ubuntu-latest

    steps:
      - name: Display OS and Swift versions
        shell: bash
        run: |
          [[ -z "${SWIFT_PLATFORM}" ]] && SWIFT_PLATFORM="$(. /etc/os-release && echo "${ID}${VERSION_ID}")"
          [[ -z "${SWIFT_VERSION}" ]] && SWIFT_VERSION="$(cat /.swift_tag 2>/dev/null || true)"
          printf 'OS:  %s\nTag: %s\nVersion:\n' "${SWIFT_PLATFORM}-${RUNNER_ARCH}" "${SWIFT_VERSION}"
          swift --version
      - uses: actions/checkout@v5
      - name: Set DEBUG specific environment variables
        if: runner.debug == '1'
        run: |
          echo "LOG_LEVEL=trace" >> "$GITHUB_ENV"
      - name: Install zstd
        run: |
          apt-get update -y
          apt-get install -y zstd
      - name: Restore .build
        id: "restore-build"
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: "${{ matrix.swift-image }}-swiftpm-tests-build-${{ runner.os }}-${{
            github.event.pull_request.base.sha || github.event.after }}"
          restore-keys: "${{ matrix.swift-image }}-swiftpm-tests-build-${{ runner.os }}-"
      - name: Build
        run: swift build --build-tests --enable-code-coverage --traits
          _IOTracing,DistributedTracingSupport
      - name: Cache .build
        # if: steps.restore-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: "${{ matrix.swift-image }}-swiftpm-tests-build-${{ runner.os }}-${{
            github.event.pull_request.base.sha || github.event.after }}"
      - name: Run tests
        run: swift test --skip-build --enable-code-coverage --traits
          _IOTracing,DistributedTracingSupport
      - name: Prepare and Upload Code Coverage
        uses: ./.github/actions/prepare-coverage
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}